name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Practical4
      id: practical4
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Practical4
        setup-command: 'javac AgeCalculator.java '
        command: 'java AgeCalculator '
        timeout: 10
        max-score: 10
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        PRACTICAL4_RESULTS: "${{steps.practical4.outputs.result}}"
      with:
        runners: practical4
